<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشروط | تمام</title><link rel="stylesheet" href="style.css"><main class="wrap" style="padding:120px 0"><h1>الشروط والأحكام</h1><p>تمام منصة لتسهيل الوصول إلى مقدمي الخدمات. الاتفاق على السعر ونطاق الخدمة والتنفيذ يكون مباشرة بين العميل ومقدم الخدمة.</p><p>تمام لا يحتفظ بمبالغ الخدمة ولا يضمن جودة أو نتيجة أي خدمة مقدمة من طرف ثالث، وعلى العميل التحقق من التفاصيل قبل الاتفاق.</p><a class="btn" href="index.html">العودة للموقع</a></main></html>
